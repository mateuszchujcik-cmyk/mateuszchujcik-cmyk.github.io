<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multi ekran ze zdjęciami</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    font-family: Arial, sans-serif;
    transition: background-color 0.5s;
  }

  .ekran {
    position: absolute;
    width: 100%;
    text-align: center;
    cursor: pointer;
    transition: opacity 0.5s;
  }

  .hidden {
    opacity: 0;
    pointer-events: none;
  }

  #napis1 {
    font-size: 80px;
    color: orange;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }

  #napis2 {
    font-size: 70px;
    color: orange;
    display: none;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }

  #napis3 {
    font-size: 60px;
    display: none;
    color: orange;
    position: absolute;
    top: 20px;
    left: 20px;
    text-align: left;
  }

  /* kontener na zdjęcia pod napisem 3 */
  #zdjecia {
    display: none;
    position: absolute;
    top: 120px; /* trochę poniżej napisu */
    left: 20px;
    display: flex;
    gap: 20px; /* odstęp między zdjęciami */
    flex-wrap: wrap; /* zawijanie zdjęć w kolejnych wierszach */
  }

  .zdjecie-box {
    text-align: center;
  }

  .zdjecie-box img {
    width: 150px; /* szerokość obrazka */
    height: auto;
    display: block;
  }

  .zdjecie-box span {
    display: block;
    margin-bottom: 10px;
    font-weight: bold;
    color: orange; /* napis nad zdjęciem pomarańczowy */
  }

</style>
</head>
<body>

<!-- Pierwszy ekran -->
<div id="napis1" class="ekran">burdelu sowirzdrzola</div>

<!-- Drugi ekran -->
<div id="napis2" class="ekran hidden">Druga strona - kliknij dalej!</div>

<!-- Trzeci ekran -->
<div id="napis3" class="ekran hidden">Trzecia strona gotowa!</div>

<!-- Zdjęcia pod trzecim napisem -->
<div id="zdjecia">
  <div class="zdjecie-box">
    <span>Napis nad zdjęciem 1</span>
    <img src="https://cdn.discordapp.com/attachments/1374411538840027237/1464766141418442914/image.png?ex=69808c86&is=697f3b06&hm=859d1a5828e94600bc931eb1626d3bdbeececf33c16a293c9ef9f55db6e7598a&" alt="Zdjęcie 1">
  </div>
  <div class="zdjecie-box">
    <span>Napis nad zdjęciem 2</span>
    <img src="https://via.placeholder.com/150" alt="Zdjęcie 2">
  </div>
  <div class="zdjecie-box">
    <span>Napis nad zdjęciem 3</span>
    <img src="https://via.placeholder.com/150" alt="Zdjęcie 3">
  </div>
</div>

<script>
  const napis1 = document.getElementById('napis1');
  const napis2 = document.getElementById('napis2');
  const napis3 = document.getElementById('napis3');
  const zdjecia = document.getElementById('zdjecia');
  const body = document.body;

  // Klik na pierwszy napis → pokazuje drugi
  napis1.addEventListener('click', () => {
    napis1.classList.add('hidden');
    setTimeout(() => {
      napis1.style.display = 'none';
      napis2.style.display = 'block';
      setTimeout(() => napis2.classList.remove('hidden'), 50);
    }, 500);
  });

  // Klik na drugi napis → pokazuje trzeci ekran z jasnym niebieskim tłem i zdjęciami
  napis2.addEventListener('click', () => {
    napis2.classList.add('hidden');
    setTimeout(() => {
      napis2.style.display = 'none';
      body.style.backgroundColor = '#cceeff'; // bardzo jasny niebieski
      napis3.style.display = 'block';
      zdjecia.style.display = 'flex';
      setTimeout(() => {
        napis3.classList.remove('hidden');
      }, 50);
    }, 500);
  });
</script>

</body>
</html>
