<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multi ekran</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: #000; /* początkowe tło */
    font-family: Arial, sans-serif;
    color: orange;
    transition: background-color 0.5s;
  }

  .ekran {
    position: absolute;
    text-align: center;
    cursor: pointer;
    transition: opacity 0.5s;
  }

  .hidden {
    opacity: 0;
    pointer-events: none;
  }

  #napis1 {
    font-size: 120px;
  }

  #napis2 {
    font-size: 70px;
    display: none;
  }

#napis3 {
    font-size: 60px;
    display: none;
    color: orange; /* pomarańczowy tekst */
    position: absolute;
    top: 20px;   /* odległość od góry */
    left: 20px;  /* odległość od lewej */
    text-align: left;
  /* kontener na zdjęcia pod napisem 3 */
#zdjecia {
  display: none;           /* ukryty na początku */
  position: absolute;
  top: 120px;              /* trochę poniżej napisu 3 */
  left: 20px;
  display: flex;
  gap: 20px;               /* odstęp między zdjęciami */
  flex-wrap: wrap;         /* zawijanie zdjęć w kolejnych wierszach */
}

.zdjecie-box {
  text-align: center;
}

.zdjecie-box img {
  width: 150px;            /* szerokość zdjęcia */
  height: auto;
  display: block;
}

.zdjecie-box span {
  display: block;
  margin-bottom: 10px;
  font-weight: bold;
  color: orange;           /* napis nad zdjęciem pomarańczowy */
}
<div id="zdjecia">
  <div class="zdjecie-box">
    <span>Napis nad zdjęciem 1</span>
    <img src="https://via.placeholder.com/150" alt="Zdjęcie 1">
  </div>
  <div class="zdjecie-box">
    <span>Napis nad zdjęciem 2</span>
    <img src="https://via.placeholder.com/150" alt="Zdjęcie 2">
  </div>
  <div class="zdjecie-box">
    <span>Napis nad zdjęciem 3</span>
    <img src="https://via.placeholder.com/150" alt="Zdjęcie 3">
  </div>
</div>

}

  }
</style>
</head>
<body>

<div id="napis1" class="ekran">burdel u sowirzdrzola</div>
<div id="napis2" class="ekran hidden">witaj w najlepszym burdelu na świecie</div>
<div id="napis3" class="ekran hidden">w naszej ofercie mamy!</div>

<script>
  const napis1 = document.getElementById('napis1');
  const napis2 = document.getElementById('napis2');
  const napis3 = document.getElementById('napis3');
  const body = document.body;

  // Klik na pierwszy napis → pokazuje drugi
  napis1.addEventListener('click', () => {
    napis1.classList.add('hidden');
    setTimeout(() => {
      napis1.style.display = 'none';
      napis2.style.display = 'block';
      setTimeout(() => napis2.classList.remove('hidden'), 50);
    }, 500);
  });

  // Klik na drugi napis → pokazuje trzeci ekran z jasnym niebieskim tłem
  napis2.addEventListener('click', () => {
    napis2.classList.add('hidden');
    setTimeout(() => {
      napis2.style.display = 'none';
      body.style.backgroundColor = '#cceeff'; // bardzo jasny niebieski
      napis3.style.display = 'block';
      setTimeout(() => napis3.classList.remove('hidden'), 50);
    }, 500);
  });
</script>

</body>
</html>
